<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./images/colorfulOrbIcon.png" />
    <title>Contact</title>
    <meta name="author" content="Rukiya D." />
    <meta name="description" content="A page to contact the artist." />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128+Text&family=Patrick+Hand&family=Shadows+Into+Light&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="text-center m-3">
      <h1>Let's Connect!</h1>
    </div>
    <!-- TODO add floating labels instead for visual and check tabbing access. -->
    <form id="contactForm" class="needs-validation">
      <div class="row m-5">
        <div class="col">
          <input
            id="firstName"
            class="form-control"
            type="text"
            placeholder="First name"
            aria-label="First name"
            required
          />
        </div>

        <div class="col">
          <input
            id="lastName"
            class="form-control"
            type="text"
            placeholder="Last name"
            aria-label="Last name"
            required
          />
        </div>
      </div>

      <div class="row m-5">
        <div class="mb-3">
          <input
            id="email"
            class="form-control"
            type="email"
            aria-describedby="emailHelp"
            placeholder="Enter email"
            required
          />
          <div id="emailFeedback" class="invalid-feedback">
            Please enter valid email. ie. example@example.com
          </div>
          <div id="emailHelp" class="form-text">
            We'll never share your email with anyone else.
          </div>
        </div>
      </div>

      <div class="row m-5">
        <div class="mb-3">
          <textarea
            id="message"
            class="form-control"
            type="text"
            placeholder="Enter your message"
            rows="3"
            required
          ></textarea>
          <div id="messageFeedback" class="invalid-feedback">
            Please enter a message.
          </div>
        </div>
      </div>
      <div class="text-center">
        <button
          id="contactFormBtn"
          type="submit"
          class="btn btn-primary text-center"
        >
          Submit
        </button>
      </div>
    </form>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./js/contact.js"></script>
  </body>
</html>
