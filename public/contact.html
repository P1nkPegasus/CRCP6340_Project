      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128+Text&family=Patrick+Hand&family=Shadows+Into+Light&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <nav
    id="navBar"
    class="navbar navbar-expand-lg navbar-light bg-light sticky-top"
  >
    <a class="navbar-brand ms-4" href="#">Rukiya D.</a>
    <button
      class="navbar-toggler"
      type="button"
      data-toggle="collapse"
      data-target="#navbarNavDropdown"
      aria-controls="navbarNavDropdown"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <!-- TODO double check functionality-->
      <ul class="navbar-nav">
        <li class="nav-item active">
          <a class="nav-link" href="index.html#homeSection"
            >Home <span class="sr-only"></span
          ></a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="index.html#aboutSection">About</a>
        </li>
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            id="navbarDropdownMenuLink"
            data-bs-toggle="dropdown"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Projects
          </a>
          <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
            <a class="dropdown-item" href="../newProject.html">What's New</a>
            <a class="dropdown-item" href="../projects.html">Projects</a>

        <li class="nav-item">
          <a class="nav-link" href="/contact.html">Contact</a>
        </li>
      </ul>
    </div>
  </nav>
  <body>
    <div class="text-center m-3">
      <h1>Let's Connect!</h1>
    </div>
    <!-- TODO add floating labels instead for visual and check tabbing access. -->
    <form id="contactForm" class="needs-validation">
      <div class="row m-5">
        <div class="col">
          <input
            id="firstName"
            class="form-control"
            type="text"
            placeholder="First name"
            aria-label="First name"
            required
          />
        </div>

        <div class="col">
          <input
            id="lastName"
            class="form-control"
            type="text"
            placeholder="Last name"
            aria-label="Last name"
            required
          />
        </div>
      </div>

      <div class="row m-5">
        <div class="mb-3">
          <input
            id="email"
            class="form-control"
            type="email"
            aria-describedby="emailHelp"
            placeholder="Enter email"
            required
          />
          <div id="emailFeedback" class="invalid-feedback">
            Please enter valid email. ie. example@example.com
          </div>
          <div id="emailHelp" class="form-text">
            We'll never share your email with anyone else.
          </div>
        </div>
      </div>

      <div class="row m-5">
        <div class="mb-3">
          <textarea
            id="message"
            class="form-control"
            type="text"
            placeholder="Enter your message"
            rows="3"
            required
          ></textarea>
          <div id="messageFeedback" class="invalid-feedback">
            Please enter a message.
          </div>
        </div>
      </div>
      <div class="text-center">
        <button
          id="contactFormBtn"
          type="submit"
          class="btn btn-primary text-center"
        >
          Submit
        </button>
      </div>
    </form>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./js/contact.js"></script>
  </body>
</html>
